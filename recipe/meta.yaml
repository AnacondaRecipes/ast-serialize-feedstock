{% set version = "0.12.1" %}
{% set name = "ast-serialize" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 5285a390caf1c44368ae270f037f797b91427d138b7d43cad0f1fda4c83518d9

build:
  number: 0
  skip: true  # [py<37]
  script:
    - cp "${RECIPE_DIR}/cargo-auditable-wrapper.sh" "${BUILD_PREFIX}/bin/cargo-auditable-wrapper"  # [not win]
    - chmod 755 "${BUILD_PREFIX}/bin/cargo-auditable-wrapper"                                       # [not win]
    - set CARGO_HOME=c:\.cg  # [win]
    - copy "%RECIPE_DIR%\cargo-auditable-wrapper.bat" "%BUILD_PREFIX%\Library\bin\cargo-auditable-wrapper.bat"  # [win]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  script_env:
    - CARGO_PROFILE_RELEASE_LTO=fat
    - CARGO_PROFILE_RELEASE_STRIP=symbols
    - CARGO=cargo-auditable-wrapper       # [not win]
    - CARGO=cargo-auditable-wrapper.bat   # [win]
    - PYTHONIOENCODING=utf-8
    - PYTHONLEGACYTEXTENCODING=utf-8

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cargo-auditable
    - cargo-bundle-licenses
  host:
    - maturin >=1.9,<2.0
    - pip
    - python
  run:
    - python

test:
  imports:
    - ast_serialize
  requires:
    - pip
    - pytest
  source_files:
    - test_ast_serialize.py
  commands:
    - pip check
    - python test_ast_serialize.py

about:
  home: https://pypi.org/project/ast-serialize
  dev_url: https://github.com/mypyc/ast_serialize
  doc_url: https://github.com/mypyc/ast_serialize/blob/main/README.md
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Python bindings for mypy AST serialization
  description: |
    This is a fast Python extension for parsing Python files and serializing the AST using the native binary format used by mypy.
    This will eventually replace the current mypy parser, which uses the Python stdlib ast module for parsing.

extra:
  recipe-maintainers:
    - conda-forge/mypy
    - bollwyvl